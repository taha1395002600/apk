    - name: Setup Runner Android SDK & Fix Paths
      run: |
        export ANDROID_HOME=$HOME/.android/sdk
        
        # ساختن ساختار کامل پوشه‌هایی که بیلدوزر مثل سگ گدا گدایی میکنه! 😂
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        
        # دانلود یا کپی ابزارها به جایی که بیلدوزر بتونه پیدا کنه
        if [ -d "$ANDROID_HOME/cmdline-tools" ]; then
          cp -r $ANDROID_HOME/cmdline-tools/* ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/
        fi
        
        # لینک دادن به مسیر باستانی مورد علاقه بیلدوزر
        if [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
          ln -sf $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
        fi
