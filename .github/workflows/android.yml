name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libreadline-dev libsqlite3-dev libssl-dev libffi-dev build-essential ccache libstdc++6

      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install git+https://github.com/kivy/buildozer.git

      - name: Setup Runner Android SDK & Build APK
        run: |
          # ۱. قبول کردن تمام لایسنس‌های SDK گیت‌هاب
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

          # ۲. نصب مستقیم ابزارهای بیلد ۳۳ و پلتفرم برای جلوگیری از دانلود مجدد
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;33.0.2" "platforms;android-33"

          # ۳. معرفی مسیر SDK آماده گیت‌هاب به بیلدوزر تا اصلاً دانلود نکنه
          sed -i 's|# android.sdk_path =.*|android.sdk_path = '"$ANDROID_HOME"'|g' buildozer.spec
          sed -i 's|# android.ndk_path =.*|android.ndk_path = '"$ANDROID_NDK_LATEST_HOME"'|g' buildozer.spec

          # ۴. اجرای بیلدوزر
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: CoDCalculator-APK
          path: bin/*.apk
